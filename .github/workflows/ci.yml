name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        flags: ["", "-Dchains=none -Dprotocols=none", "-Dchains=evm -Dprotocols=tokens", "-Dchains=svm,move"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - run: zig fmt --check src build.zig
      - run: zig build test ${{ matrix.flags }}
      - run: zig build wasm -Dchains=evm,svm
